[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Local-first technical research agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
rag = ["PyMuPDF>=1.24,<2", "faiss-cpu>=1.9,<2", "numpy>=1.25,<3"]

[project.scripts]
research-agent = "research_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"research_agent.evaluation" = ["data/*.txt"]
