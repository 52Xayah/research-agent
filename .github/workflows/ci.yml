name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ".[rag,app,test]"
      - run: python -m pip check
      - run: python -X utf8 -B -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
